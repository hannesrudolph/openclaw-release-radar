<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<title>iClaw Release Radar</title>
<style>
/* ── design tokens (iClaw subset) ─────────────────────────────────────── */
:root {
  --space-1:2px; --space-2:4px; --space-3:6px; --space-4:8px;
  --space-5:10px; --space-6:12px; --space-7:16px; --space-8:20px;
  --space-9:24px; --space-10:32px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-pill:999px;
  --text-xs:.75rem; --text-sm:.85rem; --text-base:.95rem; --text-md:1rem;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 6px rgba(0,0,0,.06);

  --bg:#f9f9f9; --surface:#fff; --surface-2:#f4f4f4;
  --border:#e4e4e7; --border-soft:rgba(0,0,0,.09);
  --text:#18181b; --muted:#71717a;
  --ok:#16a34a; --warn:#c47a00; --danger:#dc2626;
  --link:#2962ff; --link-hover:#1e54e5;
}
@media (prefers-color-scheme:dark) {
  :root {
    --bg:#1a1a1a; --surface:#232323; --surface-2:#141414;
    --border:#424242; --border-soft:rgba(255,255,255,.10);
    --text:#ececec; --muted:#9ca3af;
    --ok:#4ade80; --warn:#fbbf24; --danger:#fca5a5;
    --link:#7ab7ff; --link-hover:#a8d0ff;
    --shadow-sm:0 1px 2px rgba(0,0,0,.25);
  }
}

/* ── reset ────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  font-size:16px; -webkit-font-smoothing:antialiased;
  color:var(--text); background:var(--bg);
}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}

/* ── topbar ───────────────────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:10;
  height:52px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;
  padding:0 var(--space-9);
  gap:var(--space-5);
}
.topbar__brand{
  display:flex;align-items:center;gap:var(--space-5);
  font-weight:600;font-size:var(--text-md);letter-spacing:-.01em;
  color:var(--text);text-decoration:none;
  transition:opacity .15s;
}
.topbar__brand:hover{opacity:.75;color:var(--text)}
.topbar__logo-img{
  width:24px;height:24px;border-radius:var(--radius-sm);
  flex-shrink:0;display:block;
}
.topbar__spacer{flex:1}
.topbar__updated{
  font-size:var(--text-xs);color:var(--muted);
  display:flex;align-items:center;gap:var(--space-3);
}
.topbar__updated{color:var(--warn)}

/* ── main ─────────────────────────────────────────────────────────────── */
main{max-width:720px;margin:0 auto;padding:var(--space-9) var(--space-9) var(--space-10)}

.page-title{
  font-size:1.9rem;font-weight:700;letter-spacing:-.03em;
  margin-bottom:var(--space-3);
}
.page-title-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-6);
  margin-bottom:var(--space-3);
}
.page-title-row .page-title{margin-bottom:0}
.page-sub{
  color:var(--muted);font-size:var(--text-sm);line-height:1.55;
  margin-bottom:var(--space-10);
}
.page-sub a{color:var(--muted);border-bottom:1px dotted var(--border)}
.page-sub a:hover{color:var(--text)}

/* ── release list ─────────────────────────────────────────────────────── */
.releases{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}

.release{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-7) var(--space-8);
  border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);
  cursor:pointer;gap:var(--space-6);
  transition:background .15s ease;
}
.release:last-of-type{border-bottom:none}
.release:hover{background:color-mix(in srgb,var(--text) 3.5%,transparent)}
.release.open{background:color-mix(in srgb,var(--text) 2%,transparent)}
.release--recommended{
  background:color-mix(in srgb,var(--ok) 7%,transparent);
}
.release--recommended:hover{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.release--skip .release__tag{color:var(--muted)}

.release__left{display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
.release__head{display:flex;align-items:center;gap:var(--space-5);min-width:0;flex-wrap:wrap;row-gap:var(--space-3)}
.release__reason{
  font-size:var(--text-xs);color:var(--muted);line-height:1.45;
}
.release--skip .release__reason{color:var(--danger)}
/* ── "what it breaks" surface chips ─────────────────────────────────────── */
/* vertical list — caption and items share the same text colour; icons stay muted */
.surfaces{
  display:flex;flex-direction:column;gap:4px;margin-top:6px;
  font-size:var(--text-sm);color:var(--text);
}
.surf-label{font-weight:600;margin-bottom:1px}
.surf{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
/* the rest fold into a native <details> disclosure (top 3 always shown) */
.surf-rest{display:flex;flex-direction:column;gap:4px}
.surf-rest-items{display:flex;flex-direction:column;gap:4px}
.surf-more{
  font-size:var(--text-sm);color:var(--muted);cursor:pointer;
  list-style:none;padding-left:19px;width:fit-content;
  border-bottom:1px dotted var(--border);
}
.surf-more:hover{color:var(--text)}
.surf-more::-webkit-details-marker{display:none}
.surf-more::marker{content:"";font-size:0}
details[open] > .surf-more{display:none}
.surf-more::after{content:" ▾"}
/* brand glyph via CSS mask — muted so it matches the list tone */
.surf-ico{
  width:13px;height:13px;flex-shrink:0;background:var(--muted);opacity:.85;
  -webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;
}
.rec-pill{
  font-size:var(--text-xs);font-weight:600;white-space:nowrap;
  padding:1px var(--space-4);border-radius:var(--radius-pill);
  color:var(--ok);
  background:color-mix(in srgb,var(--ok) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--ok) 32%,transparent);
}
.release__tag{
  font-weight:600;font-size:var(--text-base);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:nowrap;
}
.release__date{color:var(--muted);font-size:var(--text-sm);white-space:nowrap}
.cve-badge{
  font-size:var(--text-xs);
  font-weight:500;
  white-space:nowrap;
}
.cve-badge--affected{ color:var(--danger) }
.release__right{
  display:flex;align-items:center;gap:var(--space-4);flex-shrink:0;
}
.score-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  background:var(--score-color,var(--muted));
}
.score-num{
  font-variant-numeric:tabular-nums;font-weight:600;
  font-size:var(--text-base);color:var(--score-color,var(--muted));
  white-space:nowrap;
}
@media(max-width:480px){
  .release__date{display:none}
}

/* ── chevron ──────────────────────────────────────────────────────────── */
.chevron{
  width:16px;height:16px;flex-shrink:0;color:var(--muted);
  transition:transform .2s ease;
}
.release.open .chevron{transform:rotate(90deg)}

/* ── expanded details ─────────────────────────────────────────────────── */
.details{
  display:none;
  background:var(--surface-2);
  border-top:1px solid var(--border);
  padding:var(--space-7) var(--space-8);
}
.release.open + .details{display:block}

.details__empty{
  color:var(--muted);font-size:var(--text-sm);
  padding:var(--space-6) 0;
  text-align:center;
}

.issue{
  display:flex;gap:var(--space-5);align-items:flex-start;
  padding:var(--space-5) 0;
  border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);
}
.issue:last-child{border-bottom:none}

.sev-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  margin-top:5px;
}
.sev-dot.critical{background:var(--danger)}
.sev-dot.high{background:var(--warn)}
.sev-dot.medium,.sev-dot.low,.sev-dot.positive{
  background:color-mix(in srgb,var(--muted) 40%,transparent);
}
.sev-dot.positive{background:color-mix(in srgb,var(--ok) 50%,transparent)}

.issue__body{min-width:0;flex:1}
.issue__title{
  display:block;
  font-size:var(--text-sm);font-weight:500;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.45;
}
.issue__title:hover{color:var(--link)}

/* ── loading / empty states ───────────────────────────────────────────── */
.state{
  padding:var(--space-10) var(--space-8);
  text-align:center;color:var(--muted);font-size:var(--text-sm);
}

/* ── recommendation block (main view) ───────────────────────────────── */
.rec-block{
  margin-top:0;
}
.rec-target{
  padding:var(--space-8) var(--space-8);
  border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);
  border-radius:18px;
  background:color-mix(in srgb,var(--ok) 8%,var(--surface));
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px color-mix(in srgb,var(--ok) 10%,transparent);
  margin-bottom:var(--space-7);
}
.rec-target--none{
  border-color:var(--border-soft);
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.rec-target__label{
  font-size:var(--text-xs);
  font-weight:600;
  color:var(--ok,#22c55e);
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin-bottom:var(--space-3);
}
.rec-target--none .rec-target__label{ color:var(--muted) }
.rec-target__tag{
  font-size:1.6rem;
  font-weight:700;letter-spacing:-.02em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--text);
}
.rec-target__reason{
  font-size:var(--text-sm);
  color:var(--muted);
  margin-top:var(--space-3);line-height:1.5;
}
/* ── footer ───────────────────────────────────────────────────────────── */
footer{
  max-width:720px;margin:0 auto;
  padding:var(--space-8) var(--space-9);
  color:var(--muted);font-size:var(--text-xs);
  text-align:center;
}
footer a{color:var(--muted);border-bottom:1px dotted var(--border)}
footer a:hover{color:var(--text)}

/* ── api link ─────────────────────────────────────────────────────────── */
.api-link{
  flex-shrink:0;
  display:inline-flex;align-items:center;
  padding:var(--space-4) var(--space-6);
  border-radius:var(--radius-md);
  font-size:.8125rem;font-weight:500;letter-spacing:.01em;
  color:var(--muted);
  background:color-mix(in srgb,var(--text) 5%,var(--bg));
  border:1px solid color-mix(in srgb,var(--border) 70%,transparent);
  transition:color .15s,background .15s,border-color .15s;
  white-space:nowrap;
}
.api-link:hover{
  color:var(--text);
  background:color-mix(in srgb,var(--text) 8%,var(--bg));
  border-color:color-mix(in srgb,var(--muted) 35%,var(--border));
}

</style>
</head>
<body>

<nav class="topbar">
  <a class="topbar__brand" href="https://iclaw.digital" target="_blank" rel="noopener">
    <img src="/iclaw-logo.png" alt="iClaw" class="topbar__logo-img" />
    iClaw
  </a>
  <div class="topbar__spacer"></div>
  <div class="topbar__updated" id="topbarUpdated" hidden>
    <span id="updatedLabel"></span>
  </div>
  <a class="api-link" href="/api/public" target="_blank" rel="noopener">API</a>
</nav>

<main>
  <div class="page-title-row">
    <h1 class="page-title">Should I install it?</h1>
  </div>
  <p class="page-sub">
    Source: <a href="https://github.com/openclaw/openclaw" target="_blank" rel="noopener">openclaw/openclaw</a>
  </p>

  <div class="rec-block" id="recBlock" hidden>
    <div class="rec-target" id="recTarget" hidden></div>
    <div class="releases" id="releases"></div>
  </div>
</main>

<footer>
  Issues analyzed with AI · <a href="https://github.com/davideuler/agent-watch" target="_blank" rel="noopener">Inspired by agent-watch</a> · <a href="https://github.com/iClawApp/openclaw-release-radar" target="_blank" rel="noopener">Open source</a>
</footer>

<script>
/* ── helpers ──────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 2)  return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  if (d === 1) return 'yesterday';
  if (d < 7)  return `${d} days ago`;
  const w = Math.floor(d / 7);
  if (w < 5)  return `${w} week${w > 1 ? 's' : ''} ago`;
  const mo = Math.floor(d / 30);
  if (mo < 12) return `${mo} month${mo > 1 ? 's' : ''} ago`;
  return `${Math.floor(d / 365)}y ago`;
}

// Install Confidence band → colour + label. The number and the label always
// agree (band is derived from the rounded score server-side, see lib/score.ts).
function scoreInfo(r) {
  const s = r.finalScore;
  const M = {
    solid:   { color: 'var(--ok)',     label: 'Solid'   },
    ok:      { color: 'var(--ok)',     label: 'OK'      },
    caution: { color: 'var(--warn)',   label: 'Caution' },
    weak:    { color: '#f97316',       label: 'Weak'    },
    skip:    { color: 'var(--danger)', label: 'Skip'    },
    wait:    { color: 'var(--muted)',  label: 'Wait'    },
  };
  const m = M[r.band] || M.wait;
  return { color: m.color, label: m.label, num: (s == null ? '—' : s.toFixed(1)) };
}

function cssId(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

/* ── api ──────────────────────────────────────────────────────────────── */
async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  if (!r.ok) throw new Error(r.status + ' ' + await r.text().catch(() => ''));
  return r.json();
}

/* ── render releases ──────────────────────────────────────────────────── */
let allReleases = [];

async function loadReleases() {
  try { allReleases = await api('/releases'); }
  catch (e) {
    const recBlock = document.getElementById('recBlock');
    if (recBlock) recBlock.hidden = false;
    const targetEl = document.getElementById('recTarget');
    targetEl.hidden = false;
    targetEl.className = 'rec-target rec-target--none';
    targetEl.innerHTML =
      `<div class="state">Could not load releases — ${esc(e.message)}</div>`;
    return;
  }
  renderReleases();
}

function renderReleases() {
  const rows = allReleases.slice(0, uiLimits.releases);
  const root = document.getElementById('releases');
  const recBlock = document.getElementById('recBlock');

  if (recBlock) recBlock.hidden = false;

  if (!rows.length) {
    const targetEl = document.getElementById('recTarget');
    targetEl.hidden = false;
    targetEl.className = 'rec-target rec-target--none';
    targetEl.innerHTML =
      '<div class="state">No releases yet — first refresh in progress</div>';
    root.innerHTML = '';
    return;
  }

  const { categorized } = categorizeReleases(rows);
  const byTag = new Map(categorized.map(c => [c.release.tag, c]));
  renderTarget(categorized);

  root.innerHTML = '';

  rows.forEach(r => {
    const si  = scoreInfo(r);
    const id  = cssId(r.tag);
    const cat = byTag.get(r.tag) ?? { category: 'normal', reason: '' };

    const row = document.createElement('div');
    row.className = 'release release--' + cat.category;
    row.dataset.tag = r.tag;
    row.style.setProperty('--score-color', si.color);

    // Only flag a problem when there is one: vulnerable → "known CVE"; otherwise
    // show nothing (no "patched" badge — absence of a flag already means "clean").
    const affectedCount = (r.advisories?.affected?.total) ?? 0;
    const advBadge = affectedCount > 0
      ? `<span class="cve-badge cve-badge--affected" title="Vulnerable to ${affectedCount} known CVE — exact severity is in the score">known CVE</span>`
      : '';

    const recPill = cat.category === 'recommended'
      ? '<span class="rec-pill">Recommended</span>' : '';
    // Eligible + skip-cve rows say everything via the score, recommended pill, CVE
    // badge and the red surface chips — so their verbose reason text is hidden.
    // Only 'wait' (too-new) and 'skip-hotfix' keep a short explanatory note.
    const reasonText = (r.status === 'skip-cve' || r.status === 'eligible')
      ? '' : (cat.reason || r.reason || '');
    const reasonLine = reasonText
      ? `<span class="release__reason">${esc(reasonText)}</span>` : '';

    // "What it breaks": top 3 named surfaces always shown; the rest fold into a
    // click-to-expand <details> (a full list runs 14–15 lines on busy releases).
    const surfaces = Array.isArray(r.brokenSurfaces) ? r.brokenSurfaces : [];
    const SURF_TOP = 3;
    const surfChip = (s) =>
      `<span class="surf"><i class="surf-ico" style="--m:url('/icons/${s.icon}.svg')"></i>${esc(s.label)}</span>`;
    const rest = surfaces.slice(SURF_TOP);
    const surfacesLine = surfaces.length
      ? `<div class="surfaces" title="Visible regressions this version introduced (still open)">`
        + `<span class="surf-label">Breaks:</span>`
        + surfaces.slice(0, SURF_TOP).map(surfChip).join('')
        + (rest.length
            ? `<details class="surf-rest"><summary class="surf-more">+${rest.length} more</summary>`
              + `<div class="surf-rest-items">` + rest.map(surfChip).join('') + `</div></details>`
            : '')
        + `</div>`
      : '';

    row.innerHTML = `
      <div class="release__left">
        <div class="release__head">
          <span class="release__tag">${esc(r.tag)}</span>
          <span class="release__date">${timeAgo(r.publishedAt)}</span>
          ${recPill}
          ${advBadge}
        </div>
        ${reasonLine}
        ${surfacesLine}
      </div>
      <div class="release__right">
        <span class="score-dot"></span>
        <span class="score-num">${esc(si.num)}</span>
        <svg class="chevron" viewBox="0 0 16 16" fill="none">
          <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;

    const det = document.createElement('div');
    det.className = 'details';
    det.id = `det-${id}`;
    det.innerHTML = '<div class="state" style="padding:var(--space-7) 0">Loading…</div>';

    row.addEventListener('click', () => toggleRelease(row, det, r.tag));
    // "+N more" toggles its own disclosure — don't let it also open the issue panel.
    row.querySelectorAll('.surf-more').forEach((el) =>
      el.addEventListener('click', (e) => e.stopPropagation()));
    root.appendChild(row);
    root.appendChild(det);
  });
}

/* ── recommendation view ─────────────────────────────────────────────────
 * The server (lib/score.ts) already answers "which stable should I install?"
 * via gates + Install Confidence and flags exactly one release as `recommended`.
 * The UI just maps each release's status into a display category + reason:
 *   - 'skip'        : known CVE, or the maintainers hotfixed it
 *   - 'too-new'     : younger than the settle window (status 'wait')
 *   - 'recommended' : the one release the server picked (newest eligible ≥7)
 *   - 'normal'      : eligible but not the pick — its score speaks for itself
 */
function categorizeReleases(rows) {
  const out = rows.map((r) => {
    const adv = r.advisories?.affected ?? { total: 0, bySeverity: {} };
    const affectedCves = adv.total ?? 0;
    let category = 'normal';
    let reason = '';
    if (affectedCves > 0 || r.status === 'skip-cve') {
      category = 'skip';
      const sev = ['critical', 'high', 'medium', 'low']
        .filter((s) => (adv.bySeverity?.[s] ?? 0) > 0)
        .map((s) => `${adv.bySeverity[s]} ${s}`)
        .join(', ');
      reason = affectedCves > 0
        ? `Vulnerable to ${affectedCves} known CVE${sev ? ` (${sev})` : ''} — upgrade past this version`
        : (r.reason || 'Vulnerable to a known CVE — upgrade past this version');
    } else if (r.status === 'skip-hotfix') {
      category = 'skip';
      reason = r.reason || 'Maintainers hotfixed it — install the successor';
    } else if (r.status === 'wait') {
      category = 'too-new';
      reason = r.reason || 'Too new — wait for it to settle';
    } else if (r.recommended) {
      category = 'recommended';
      reason = '';
    }
    return { release: r, category, reason };
  });
  return { categorized: out };
}

function renderTarget(categorized) {
  // The recommended release is flagged inline in the list (green row + pill),
  // so there's no prominent callout. We only surface a banner when there is
  // NO safe target — that's the case worth interrupting the user for.
  const target = categorized.find(c => c.category === 'recommended');
  const targetEl = document.getElementById('recTarget');
  if (target) {
    targetEl.hidden = true;
    targetEl.innerHTML = '';
    return;
  }
  targetEl.hidden = false;
  targetEl.className = 'rec-target rec-target--none';
  targetEl.innerHTML = `
    <div class="rec-target__label">No safe target right now</div>
    <div class="rec-target__reason">
      All recent releases either have heavy bug-load or haven't settled yet.
      Wait a few days and check again.
    </div>
  `;
}

/* ── toggle release row ───────────────────────────────────────────────── */
async function toggleRelease(row, det, tag) {
  const opening = !row.classList.contains('open');

  // close all
  document.querySelectorAll('.release.open').forEach(r => r.classList.remove('open'));

  if (!opening) return;
  row.classList.add('open');

  // already loaded?
  if (det.dataset.loaded) return;
  det.dataset.loaded = '1';

  try {
    const data = await api('/release/' + encodeURIComponent(tag));
    renderIssues(det, data.issues ?? []);
  } catch (e) {
    det.innerHTML = `<div class="details__empty">Failed to load: ${esc(e.message)}</div>`;
  }
}

function renderIssues(det, issues) {
  if (!issues.length) {
    det.innerHTML = '<div class="details__empty">No reported issues for this version yet</div>';
    return;
  }

  // show negatives first, then positives, skip neutral without rationale
  const sorted = [...issues].sort((a, b) => {
    const sevOrder = { critical: 0, high: 1, medium: 2, low: 3 };
    const sentOrder = { negative: 0, positive: 1, neutral: 2 };
    if (a.sentiment !== b.sentiment) return sentOrder[a.sentiment] - sentOrder[b.sentiment];
    return (sevOrder[a.severity] ?? 9) - (sevOrder[b.severity] ?? 9);
  });

  det.innerHTML = sorted.map(i => {
    const dotClass = i.sentiment === 'positive' ? 'positive' : (i.severity ?? 'low');
    return `
      <div class="issue">
        <span class="sev-dot ${esc(dotClass)}"></span>
        <div class="issue__body">
          <a class="issue__title" href="${esc(i.htmlUrl)}" target="_blank"
             rel="noopener" title="${esc(i.title)}">${esc(i.title)}</a>
        </div>
      </div>`;
  }).join('');
}

/* ── status dot ───────────────────────────────────────────────────────── */
// Freshness is a silent guard: users don't care how often we refresh, so we
// show nothing while data is current. We only surface an indicator when the
// last successful refresh is older than STALE_AFTER_MS — i.e. the install
// advice on screen might no longer reflect reality.
const STALE_AFTER_MS = 6 * 60 * 60 * 1000; // 6 hours

async function loadStatus() {
  const box = document.getElementById('topbarUpdated');
  const label = document.getElementById('updatedLabel');
  try {
    const s = await api('/status');
    const last = s.lastRefreshAt ? Date.parse(s.lastRefreshAt) : NaN;
    const age = Number.isFinite(last) ? Date.now() - last : Infinity;
    if (age <= STALE_AFTER_MS) {
      box.hidden = true; // fresh enough — stay quiet
      return;
    }
    box.hidden = false;
    label.textContent = Number.isFinite(last)
      ? 'Data may be stale — last updated ' + timeAgo(s.lastRefreshAt)
      : 'Data not yet refreshed';
  } catch {
    // Can't reach the status endpoint — treat as a staleness warning.
    box.hidden = false;
    label.textContent = 'Status unavailable';
  }
}

/* ── init ─────────────────────────────────────────────────────────────── */
let uiLimits = { releases: 10, refreshMinutes: 30 };

(async () => {
  try { uiLimits = await api('/config'); } catch { /* use defaults */ }
  loadStatus();
  loadReleases();
  setInterval(loadStatus, 30_000);
})();
</script>
